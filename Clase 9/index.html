<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Suscripción Diario Online</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header>
  <h1>Diario Online</h1>
  <h2 id="titulo">Suscribite al mejor diario de tecnología de la región.</h2>
</header>

<main>
  <form id="formulario">
    <div class="form-row">
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" id="nombre" />
        <span class="error" id="error-nombre"></span>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" />
        <span class="error" id="error-email"></span>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" />
        <span class="error" id="error-password"></span>
      </div>
      <div class="form-group">
        <label>Repetir contraseña</label>
        <input type="password" id="repetir" />
        <span class="error" id="error-repetir"></span>
      </div>
      <div class="form-group">
        <label>Edad</label>
        <input type="number" id="edad" />
        <span class="error" id="error-edad"></span>
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" id="telefono" />
        <span class="error" id="error-telefono"></span>
      </div>
      <div class="form-group">
        <label>Dirección</label>
        <input type="text" id="direccion" />
        <span class="error" id="error-direccion"></span>
      </div>
      <div class="form-group">
        <label>Ciudad</label>
        <input type="text" id="ciudad" />
        <span class="error" id="error-ciudad"></span>
      </div>
      <div class="form-group">
        <label>Código Postal</label>
        <input type="text" id="cp" />
        <span class="error" id="error-cp"></span>
      </div>
      <div class="form-group">
        <label>DNI</label>
        <input type="text" id="dni" />
        <span class="error" id="error-dni"></span>
      </div>
    </div>
    <button type="submit">Enviar</button>
  </form>
</main>

<footer>
  <p>&copy; 2025 Diario Online</p>
</footer>

<script src="script.js"></script>
</body>
</html>
