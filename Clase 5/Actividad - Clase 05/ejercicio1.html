<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Hoja de Estilo Interna</title>
    <style>
        /* Cambia el color de fondo del h2 */
        h2 {
            background-color: #004c8c;
            color: rgb(255, 255, 255);
            padding: 10px;
            text-align: center;
        }

        /* Cambia el tipo y color de fuente de la lista desordenada */
        ul {
            font-family: "Arial", sans-serif;
            color: #ff0800;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h2>Ejercicio 1</h2>

    <ul>
        <li>Elemento 1</li>
        <li>Elemento 2</li>
        <li>Elemento 3</li>
    </ul>

</body>
</html>
