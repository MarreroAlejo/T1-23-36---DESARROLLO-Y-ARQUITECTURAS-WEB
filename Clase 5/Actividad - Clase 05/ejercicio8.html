<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de !important</title>
    <style>
        p {
            color: blue;
            font-size: 16px;
        }

        .destacado {
            color: red !important;
            font-size: 20px !important;
        }
    </style>
</head>
<body>

    <p class="destacado">Este es un párrafo con prioridad de estilos.</p>

</body>
</html>
